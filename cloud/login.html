<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ImaginePro · Demo access</title><link rel="icon" href="/icon.svg"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 5%,#224f5266,transparent 60%),#071018;color:#edf5f8;font:15px 'Segoe UI',Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,420px);padding:38px;border:1px solid #b0d6e62b;border-radius:22px;background:#18323ac7;box-shadow:0 25px 80px #0005;backdrop-filter:blur(20px)}.brand{display:flex;align-items:center;gap:13px;font-weight:600;font-size:24px}.brand img{width:44px;height:44px}h1{font-size:30px;font-weight:500;letter-spacing:-1px;margin:38px 0 12px}p{color:#a1bac8;line-height:1.6}label{display:block;margin-top:28px;color:#c4dbdf;font-size:13px}input{width:100%;border-radius:9px;padding:13px;margin:9px 0 20px;border:1px solid #a4c7d540;background:#0b1a24;color:#edf5f8;font:inherit}button{width:100%;border:0;border-radius:9px;background:#acf5d2;color:#17352e;padding:14px;font:600 14px 'Segoe UI',sans-serif;cursor:pointer}button:disabled{opacity:.6}.error{min-height:25px;color:#f3bfaf;font-size:13px}.footer{margin-top:28px;font-size:11px;color:#829fab}</style></head><body><main class="card"><div class="brand"><img src="/icon.svg" alt=""><span>ImaginePro</span></div><h1>Make your next story.</h1><p>Enter your demo passcode to open the studio.</p><form id="login"><label for="password">Demo passcode</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit">Open ImaginePro</button><p role="alert" class="error" id="error"></p></form><p class="footer">Your creative direction. A finished video.</p></main><script>document.querySelector('#login').addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('#submit');button.disabled=true;document.querySelector('#error').textContent='';try{const response=await fetch('/api/demo/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const result=await response.json();if(!response.ok)throw Error(result.detail||'Unable to sign in.');location.replace('/');}catch(error){document.querySelector('#error').textContent=error.message;}finally{button.disabled=false;}});</script></body></html>
