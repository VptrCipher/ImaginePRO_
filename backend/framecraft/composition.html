<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:"><style>html,body{margin:0;overflow:hidden;background:transparent}canvas{display:block}</style></head><body><canvas></canvas><script>
// Trusted scene-graph interpreter. All illustrations and poses arrive as JSON data.
window.initScene=function(config){
 const c=document.querySelector('canvas');c.width=config.width;c.height=config.height;
 const X=c.getContext('2d',{willReadFrequently:true}),W=c.width,H=c.height,FPS=30;
 const scenes=config.film.scenes;let cursor=0;
 const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)},out=x=>1-(1-clamp(x))**3;
 function seeded(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
 const textures=scenes.map((s,i)=>{let a=document.createElement('canvas');a.width=W;a.height=H;let A=a.getContext('2d'),r=seeded(729+i);
   if(s.texture==='paper'||s.texture==='grain')for(let n=0;n<Math.min(50000,W*H/35);n++){let v=r()>.6?255:30;A.fillStyle=`rgba(${v},${v},${v},${r()*.055})`;A.fillRect(r()*W,r()*H,.5+r()*2,.5+r()*2)}
   if(s.texture==='paper'){A.strokeStyle='#70533914';A.lineWidth=.7;for(let n=0;n<900;n++){let x=r()*W,y=r()*H;A.beginPath();A.moveTo(x,y);A.lineTo(x+r()*11,y+r()*4);A.stroke()}}
   if(s.texture==='halftone'){A.fillStyle='#17313b12';for(let y=0;y<H;y+=16)for(let x=(y%32?8:0);x<W;x+=16){A.beginPath();A.arc(x,y,1.6,0,Math.PI*2);A.fill()}}
   return a;});
 for(const s of scenes){s._offset=cursor;cursor+=s.duration;s._ids=new Map(s.elements.map(e=>[e.id,e]));for(const e of s.elements){e._poses=[...e.poses].sort((a,b)=>a.at-b.at);if(e.kind==='path')e._path=new Path2D(e.path);}}
 function pose(e,t){let a=e._poses;if(!a.length)return{x:e.x,y:e.y,rotation:0,scale_x:1,scale_y:1,alpha:1};
   if(t<=a[0].at)return a[0];if(t>=a[a.length-1].at)return a[a.length-1];let j=1;while(a[j].at<t)j++;
   let k=ease((t-a[j-1].at)/(a[j].at-a[j-1].at||1)),p={};for(let name of ['x','y','rotation','scale_x','scale_y','alpha'])p[name]=a[j-1][name]+(a[j][name]-a[j-1][name])*k;return p;}
 function transform(e,t,s,depth=0){if(depth>8)throw Error('Group nesting too deep');if(e.parent)transform(s._ids.get(e.parent),t,s,depth+1);
   if(t<e.start||t>=e.end)X.globalAlpha=0;let p=pose(e,t),v=out((t-e.start)/Math.min(.45,(e.end-e.start)/3));
   X.translate(p.x,p.y);X.rotate(p.rotation*Math.PI/180);X.scale(p.scale_x,p.scale_y);X.globalAlpha*=p.alpha;
   if(e.entrance!=='none'&&e.entrance!=='draw'&&e.entrance!=='type')X.globalAlpha*=v;
   if(e.entrance==='rise')X.translate(0,(1-v)*H*.035);if(e.entrance==='slide')X.translate((1-v)*-W*.09,0);
   if(e.entrance==='pop'){let z=Math.max(.01,1-Math.exp(-8*v)*Math.cos(8*v));X.scale(z,z);}}
 function text(e,t){let lines=e.text.split('\n'),size=e.font_size;X.textAlign=e.align;X.textBaseline='top';
   do{X.font=`${e.weight} ${size}px "${e.font}"`;if(Math.max(...lines.map(l=>X.measureText(l).width))<=Math.max(1,e.width)&&lines.length*size*1.14<=Math.max(size,e.height))break;size-=2}while(size>10);
   if(e.entrance==='type'){let count=Math.floor(clamp((t-e.start)/Math.min(.8,(e.end-e.start)*.3))*e.text.length),used=0;lines=lines.map(l=>{let v=l.slice(0,Math.max(0,count-used));used+=l.length;return v;});}
   const anchor=e.align==='center'?e.width/2:e.align==='right'?e.width:0;
   lines.forEach((line,i)=>{if(e.fill!=='none')X.fillText(line,anchor,i*size*1.14);if(e.stroke!=='none'&&e.stroke_width)X.strokeText(line,anchor,i*size*1.14)});}
 function draw(e,t,s,f){if(e.kind==='group'||t<e.start||t>=e.end)return;X.save();transform(e,t,s);
   if(s.texture==='paper'&&e.stroke!=='none'){let j=Math.floor(f/2);X.translate(Math.sin(j*2.1+e.id.length)*.8,Math.cos(j*1.7+e.id.length)*.8)}
   X.fillStyle=e.fill==='none'?'transparent':e.fill;X.strokeStyle=e.stroke==='none'?'transparent':e.stroke;X.lineWidth=e.stroke_width;X.lineCap='round';X.lineJoin='round';
   if(e.entrance==='draw'){let p=out((t-e.start)/.65);X.beginPath();X.rect(-W,-H,(W+Math.max(e.width,W))*p,H*3);X.clip();}
   let path=null;X.beginPath();
   if(e.kind==='text')text(e,t);
   if(e.kind==='path')path=e._path;
   if(e.kind==='rect')X.roundRect(0,0,e.width,e.height,Math.min(e.radius,e.width/2,e.height/2));
   if(e.kind==='ellipse')X.ellipse(0,0,Math.max(.01,e.width/2),Math.max(.01,e.height/2),0,0,Math.PI*2);
   if(e.kind==='line'){X.moveTo(0,0);X.lineTo(e.width,e.height)}
   if(e.kind==='star'){for(let i=0;i<16;i++){let a=i*Math.PI/8-Math.PI/2,r=e.width/2*(i%2?.4:1);X.lineTo(Math.cos(a)*r,Math.sin(a)*r)}X.closePath();}
   if(e.kind!=='text'){if(e.fill!=='none'&&e.kind!=='line'){if(path)X.fill(path);else X.fill()}
     if(e.stroke!=='none'&&e.stroke_width){if(path)X.stroke(path);else X.stroke()}}
   X.restore();}
 window.render=function(f){let t=Math.min(config.duration-.0001,f/30);X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.globalCompositeOperation='source-over';X.filter='none';X.clearRect(0,0,W,H);
   let index=scenes.findIndex(s=>t<s._offset+s.duration);if(index<0)index=scenes.length-1;let s=scenes[index],local=t-s._offset;
   X.save();let p=out(local/.45);if(index&&s.transition==='wipe'){X.beginPath();X.rect(0,0,W*p,H);X.clip()}
   if(index&&s.transition==='iris'){X.beginPath();X.arc(W/2,H/2,Math.hypot(W,H)*p,0,Math.PI*2);X.clip()}
   if(s.background!=='transparent'){X.fillStyle=s.background;X.fillRect(0,0,W,H)}
   for(const e of s.elements)draw(e,local,s,f);
   if(s.background!=='transparent')X.drawImage(textures[index],0,0);X.restore();};
 window.sceneInfo={FPS,NF:Math.ceil(config.duration*30)};window.READY=true;window.render(0);
};
</script></body></html>
